<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Downloader Service</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <h1>🎬 Video Downloader Service</h1>
    <p class="subtitle">
      Paste a video URL (YouTube and hundreds of other sites via
      <a href="https://github.com/yt-dlp/yt-dlp" target="_blank" rel="noopener">yt-dlp</a>).
      Only download content you own or are authorized to.
    </p>

    <form id="download-form">
      <input
        id="url-input"
        type="url"
        placeholder="https://www.youtube.com/watch?v=..."
        required
      />

      <div class="row">
        <label>
          Format
          <select id="format-select">
            <option value="video">Video (mp4)</option>
            <option value="audio">Audio only (mp3)</option>
          </select>
        </label>

        <label>
          Quality
          <select id="quality-select">
            <option value="best">Best</option>
            <option value="1080p">1080p</option>
            <option value="720p">720p</option>
            <option value="480p">480p</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button type="button" id="info-btn">Get Info</button>
        <button type="submit" id="download-btn">Download</button>
      </div>
    </form>

    <section id="info-card" class="card hidden">
      <img id="info-thumbnail" alt="Thumbnail" />
      <div>
        <h2 id="info-title"></h2>
        <p id="info-meta"></p>
      </div>
    </section>

    <section id="job-card" class="card hidden">
      <p id="job-status-text">Starting...</p>
      <div class="progress-track">
        <div id="progress-bar" class="progress-fill"></div>
      </div>
      <a id="download-link" class="hidden" href="#">Save file</a>
    </section>

    <p id="error-text" class="error hidden"></p>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
